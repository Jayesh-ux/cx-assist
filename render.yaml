resources:
  - name: cx-db
    type: postgresql
    plan: free
    databaseName: cxassist
    user: cx

  - name: cx-redis
    type: redis
    plan: free
    ipAllowList: []

services:
  - type: web
    name: cx-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cx-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromDatabase:
          name: cx-redis
          property: connectionString
    healthCheckPath: /api/health
    autoDeploy: true

  - type: static
    name: cx-frontend
    staticPublishPath: frontend
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://cx-backend.onrender.com
